<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<title>Unpaired — technical wool socks</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180.png">
</head>
<body>
<x-dc>
<helmet>
<style>
  @font-face{font-family:'Oldburg Display';src:url('assets/fonts/OldburgDisplay-Semibold.ttf') format('truetype');font-weight:600;font-display:swap;}
  @font-face{font-family:'Syne Mono';src:url('assets/fonts/SyneMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  body{margin:0;background:#f4f2ee;}
  ::selection{background:#e8542f;color:#f4f2ee;}
  input::placeholder{color:#8a877f;}
  a{color:#1f3d2b;}
  a:hover{color:#e8542f;}
</style>
</helmet>
<div style="position:relative;font-family:'Syne Mono',monospace;color:#f4f2ee;min-height:100vh;display:flex;flex-direction:column;">
  <div style="position:fixed;inset:0;background:#1f3d2b;"></div>
  <div style="position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;">
    <div style="flex:1.6;background:#14261b;"></div>
    <div style="flex:2.4;background:#e8542f;"></div>
    <div style="flex:1;background:#d9b23c;"></div>
    <div style="flex:1.7;background:#8fa593;"></div>
    <div style="flex:0.7;background:#d9ecfa;"></div>
    <div style="flex:1.3;background:#e8542f;"></div>
    <div style="flex:1.4;background:#14261b;"></div>
  </div>

  <header style="position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px clamp(20px,5vw,40px);border-bottom:1px solid rgba(244,242,238,0.18);">
    <span style="font-family:'Oldburg Display';font-weight:600;font-size:18px;letter-spacing:1px;">UNPAIRED</span>
    <span style="font-size: 13px; color: rgb(230, 230, 224);">Coming Soon</span>
  </header>

  <section style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(32px,6vw,40px) clamp(20px,5vw,24px) 80px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;">
    <h1 style="font-family:'Oldburg Display';font-weight:600;font-size:clamp(34px,10vw,56px);margin:0;letter-spacing:1px;">UNPAIRED</h1>
    <p style="font-size:clamp(14px,3.6vw,17px);line-height:1.5;margin:16px 0 48px;">because life is too short for matching socks</p>

    <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
      <div style="background:#14261b;color:#f4f2ee;padding:16px 22px;border-radius:12px;font-size:14px;">Thanks — you're on the list.</div>
    </sc-if>
    <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ handleSubmit }}" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;">
        <input type="email" required="{{ true }}" placeholder="Email Address" value="{{ email }}" onChange="{{ handleEmailChange }}" style="flex:1;min-width:220px;max-width:320px;padding:16px 18px;font-size:14px;font-family:'Syne Mono',monospace;border:none;border-radius:8px;background:#f4f2ee;color:#1f3d2b;">
        <button type="submit" style="background:#e8542f;color:#f4f2ee;border:none;font-weight:700;font-size:14px;font-family:'Syne Mono',monospace;padding:16px 24px;border-radius:999px;cursor:pointer;">Notify Me</button>
      </form>
    </sc-if>
  </section>

  <footer style="position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:34px clamp(20px,5vw,40px) 22px;">
    <span style="font-size:12px;color:#e6e6e0;">© 2026 Unpaired</span>
    <a href="mailto:hello@unpairedapparel.com" style="font-size:12px;text-decoration:underline;color:#f4f2ee;">hello@unpairedapparel.com</a>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', submitted: false };
  renderVals() {
    return {
      email: this.state.email,
      submitted: this.state.submitted,
      notSubmitted: !this.state.submitted,
      handleEmailChange: (e) => this.setState({ email: e.target.value }),
      handleSubmit: (e) => {
        e.preventDefault();
        if (this.state.email) this.setState({ submitted: true });
      },
    };
  }
}
</script>
</body>
</html>
