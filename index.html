<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<title>Unpaired — technical wool socks</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180.png">
</head>
<body>
<x-dc>
<helmet>
<style>
  @font-face{font-family:'Oldburg Display';src:url('assets/fonts/OldburgDisplay-Semibold.ttf') format('truetype');font-weight:600;font-display:swap;}
  @font-face{font-family:'Syne Mono';src:url('assets/fonts/SyneMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  body{margin:0;background:#f4f2ee;}
  ::selection{background:#e8542f;color:#f4f2ee;}
  input::placeholder{color:#8a877f;}
  a{color:#1f3d2b;}
  a:hover{color:#e8542f;}
</style>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</helmet>
<div style="position:relative;font-family:'Syne Mono',monospace;color:#f4f2ee;min-height:100vh;display:flex;flex-direction:column;">
  <div style="position:fixed;inset:0;background:#1f3d2b;"></div>
  <div style="position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;">
    <div style="flex:1.6;background:#14261b;"></div>
    <div style="flex:2.4;background:#e8542f;"></div>
    <div style="flex:1;background:#d9b23c;"></div>
    <div style="flex:1.7;background:#8fa593;"></div>
    <div style="flex:0.7;background:#d9ecfa;"></div>
    <div style="flex:1.3;background:#e8542f;"></div>
    <div style="flex:1.4;background:#14261b;"></div>
  </div>

  <header style="position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px clamp(20px,5vw,40px);border-bottom:1px solid rgba(244,242,238,0.18);">
    <span style="font-family:'Oldburg Display';font-weight:600;font-size:18px;letter-spacing:1px;">UNPAIRED</span>
    <span style="font-size: 13px; color: rgb(230, 230, 224);">Coming Soon</span>
  </header>

  <section style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(32px,6vw,40px) clamp(20px,5vw,24px) 80px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;">
    <h1 style="font-family:'Oldburg Display';font-weight:600;font-size:clamp(34px,10vw,56px);margin:0;letter-spacing:1px;">UNPAIRED</h1>
    <p style="font-size:clamp(14px,3.6vw,17px);line-height:1.5;margin:16px 0 48px;">because life is too short for matching socks</p>

    <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
      <div style="background:#14261b;color:#f4f2ee;padding:16px 22px;border-radius:12px;font-size:14px;">Thanks — you're on the list.</div>
    </sc-if>
    <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
      <form action="https://zgnp-zngp.maillist-manage.com/weboptin.zc" method="POST" target="zc_hidden_iframe" onSubmit="{{ handleSubmit }}" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;">
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;">
          <input type="email" required="{{ true }}" placeholder="Email Address" name="CONTACT_EMAIL" value="{{ email }}" onChange="{{ handleEmailChange }}" style="flex:1;min-width:220px;max-width:320px;padding:16px 18px;font-size:14px;font-family:'Syne Mono',monospace;border:none;border-radius:8px;background:#f4f2ee;color:#1f3d2b;">
          <button type="submit" disabled="{{ captchaDisabled }}" style="background:{{ buttonBg }};color:#f4f2ee;border:none;font-weight:700;font-size:14px;font-family:'Syne Mono',monospace;padding:16px 24px;border-radius:999px;cursor:{{ buttonCursor }};">Notify Me</button>
        </div>
        <div id="zc-recaptcha-slot"></div>
        <input type="hidden" id="fieldBorder" value="">
        <input type="hidden" name="submitType" value="optinCustomView">
        <input type="hidden" name="emailReportId" value="">
        <input type="hidden" name="formType" value="QuickForm">
        <input type="hidden" name="zx" value="11bd3f45">
        <input type="hidden" name="zcvers" value="3.0">
        <input type="hidden" name="oldListIds" value="">
        <input type="hidden" name="mode" value="OptinCreateView">
        <input type="hidden" name="zcld" value="11787e906c442a69c">
        <input type="hidden" name="zctd" value="11787e906c4427f71">
        <input type="hidden" id="document_domain" value="">
        <input type="hidden" id="zc_Url" value="zgnp-zngp.maillist-manage.com">
        <input type="hidden" id="new_optin_response_in" value="0">
        <input type="hidden" id="duplicate_optin_response_in" value="0">
        <input type="hidden" name="zc_trackCode" value="ZCFORMVIEW">
        <input type="hidden" name="zc_formIx" value="3z8268d3405f2501ea2bdcbcc77e146f8762bfce2ef7ecf06a0e342af6b8db334b">
        <input type="hidden" id="viewFrom" value="URL_ACTION">
        <input type="hidden" name="scriptless" value="yes">
        <input type="hidden" id="zc_spmSubmit" name="zc_spmSubmit" value="ZCSPMSUBMIT">
      </form>
    </sc-if>
  </section>

  <footer style="position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:34px clamp(20px,5vw,40px) 22px;">
    <span style="font-size:12px;color:#e6e6e0;">© 2026 Unpaired</span>
    <a href="mailto:hello@unpairedapparel.com" style="font-size:12px;text-decoration:underline;color:#f4f2ee;">hello@unpairedapparel.com</a>
  </footer>
  <iframe name="zc_hidden_iframe" style="display:none;"></iframe>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', submitted: false, captchaOk: false };
  componentDidMount() {
    const tryRender = () => {
      const slot = document.getElementById('zc-recaptcha-slot');
      if (window.grecaptcha && window.grecaptcha.render && slot && !this._rendered) {
        this._rendered = true;
        try {
          window.grecaptcha.render(slot, {
            sitekey: '6Lf3dqItAAAAAOztyEerMEKAeIep66yVhxbzveIg',
            callback: () => this.setState({ captchaOk: true }),
            'expired-callback': () => this.setState({ captchaOk: false }),
          });
        } catch (err) {
          console.error('grecaptcha render error', err);
        }
      } else if (!this._rendered) {
        setTimeout(tryRender, 300);
      }
    };
    tryRender();
  }
  renderVals() {
    const captchaDisabled = !this.state.captchaOk;
    return {
      email: this.state.email,
      submitted: this.state.submitted,
      notSubmitted: !this.state.submitted,
      captchaDisabled,
      buttonBg: captchaDisabled ? '#8a877f' : '#e8542f',
      buttonCursor: captchaDisabled ? 'not-allowed' : 'pointer',
      handleEmailChange: (e) => this.setState({ email: e.target.value }),
      handleSubmit: (e) => {
        if (!this.state.email || !this.state.captchaOk) { e.preventDefault(); return; }
        const spamField = e.target.querySelector('#zc_spmSubmit');
        if (spamField) spamField.remove();
        this.setState({ submitted: true });
      },
    };
  }
}
</script>
</body>
</html>
